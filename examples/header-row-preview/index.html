<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Context Inspector header row preview</title>
  <link rel="stylesheet" href="../../src/inspector.css">
  <style>
    :root {
      --dsw-alias-label-primary: #182230;
      --dsw-alias-label-secondary: #647181;
      --dsw-alias-label-tertiary: #8793a1;
      --dsw-alias-settings-card-stroke: #dce2e9;
      --dsw-alias-bg-layer-1: #fff;
      --dsw-alias-state-business-primary: #2867d6;
      --dsw-alias-state-success-primary: #208451;
      --dsw-alias-state-warn-secondary: #a86c06;
      --dsw-radius-sm: 5px;
      --dsw-radius-xl: 12px;
    }
    body { margin: 0; font: 13px/1.5 Arial, sans-serif; color: #182230; background: #fff; }
    .host-button { min-height: 28px; box-sizing: border-box; padding: 3px 10px; border: 1px solid #cbd3de; border-radius: 6px; color: #182230; background: #fff; font: inherit; cursor: pointer; }
    #refresh-feedback { margin: 8px 20px; font-size: 12px; color: #647181; }
    @media (max-width: 600px) { #refresh-feedback { margin-inline: 12px; } }
  </style>
</head>
<body>
  <section class="dsh-context-settings cmv-view" aria-label="Context">
    <div class="cmv-inner">
      <header class="cmv-header">
        <div class="cmv-heading">
          <h2>上下文</h2>
          <span class="cmv-muted">只读</span>
          <span class="cmv-binding-status" data-mode="native" role="status" title="由系统整理">由系统整理</span>
          <span class="cmv-binding-refresh" hidden>正在确认状态</span>
        </div>
        <span class="cmv-muted" tabindex="0">设置</span>
        <button class="host-button" id="refresh" type="button">刷新</button>
      </header>
      <div id="refresh-feedback" aria-live="polite"></div>
    </div>
  </section>
  <script>
    window.headerStatuses = {
      zh: '由系统整理：当前宿主暂不支持增强压缩切换，本会话继续使用系统默认方式；刷新后重新确认状态。',
      en: 'Handled by the system: this Host cannot switch enhanced compaction, so this session keeps the built-in method; refresh to check again.'
    };
    window.setHeaderLocale = locale => {
      const status = document.querySelector('.cmv-binding-status');
      status.textContent = window.headerStatuses[locale];
      status.title = window.headerStatuses[locale];
      document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
    };
    let refreshCount = 0;
    document.getElementById('refresh').addEventListener('click', () => {
      refreshCount += 1;
      document.getElementById('refresh-feedback').textContent = `刷新已触发 ${refreshCount}`;
    });
    window.refreshCount = () => refreshCount;
  </script>
</body>
</html>
