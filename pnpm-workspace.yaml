# Build this Bundle independently against the explicit harness-sdk development link.
# Runtime dependency declarations remain in package.json.
packages:
  - .
allowBuilds:
  esbuild: true
overrides:
  '@deepseek-ai/cordis': 'link:./harness-sdk/vendor/cordis'
  '@deepseek-ai/cordis-plugin-group': 'link:./harness-sdk/vendor/group'
